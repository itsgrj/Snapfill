<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delegate registration</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f7;color:#1f2328;font:15px/22px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;align-items:center;gap:28px;height:56px;padding:0 40px;background:#fff;border-bottom:1px solid #e6e6e6}header b{font-size:16px}header nav{display:flex;gap:22px;color:#59636e}
main{padding:40px}form{max-width:680px;padding:32px;background:#fff;border:1px solid #e6e6e6;border-radius:8px}
h1{margin:0;font-size:24px;line-height:32px}p.sub{margin:6px 0 0;color:#59636e}.g{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin-top:24px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}input,select{height:40px;padding:0 12px;border:1px solid #c9ccd1;border-radius:6px;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff}
button{margin-top:24px;height:40px;padding:0 20px;border:0;border-radius:6px;background:#1f6feb;color:#fff;font-weight:600;font-size:15px}</style></head>
<body><header><b>Cloud Security Summit</b><nav><span>Agenda</span><span>Speakers</span><span>Venue</span></nav></header>
<main><form onsubmit="return false"><h1>Delegate registration</h1><p class="sub">A sample event form. Click Full name to try Snapfill.</p><div class="g"><label>Full name<input type="text" autocomplete="off"></label><label>Work email<input type="email" autocomplete="off"></label><label>Mobile number<input type="tel" autocomplete="off"></label><label>Organisation<input type="text" autocomplete="off"></label><label>Designation<input type="text" autocomplete="off"></label><label>City<input type="text" autocomplete="off"></label><label>Country<select><option value="">Select</option><option>India</option><option>United States</option><option>United Kingdom</option><option>Singapore</option></select></label><label>LinkedIn profile<input type="text" autocomplete="off"></label><label>Create a password<input type="password" autocomplete="off"></label></div><button type="button">Complete registration</button></form></main></body></html>
