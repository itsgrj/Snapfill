name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the extension
        run: |
          cp -r extension Snapfill
          zip -r Snapfill.zip Snapfill
      - name: Attach Snapfill.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Snapfill.zip --clobber
